[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pjm-spike-forecast"
version = "1.0.0"
description = "Intraday electricity price spike detection and forecasting for PJM Interconnection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kanishk"},
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "shap>=0.42",
    "joblib>=1.3",
    "requests>=2.31",
    "tzdata>=2023.3"
]

[project.optional-dependencies]
pjm = [
    "gridstatus>=0.27",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
pjm-forecast = "pjm_spike_forecast.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pjm_spike_forecast --cov-report=term-missing --cov-report=html -v"

[tool.coverage.run]
source = ["pjm_spike_forecast"]
omit = ["*/tests/*", "*/visualization.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def download_nyiso",
    "def _download_nyiso",
    "def download_pjm",
    "def download_weather",
    "resp = requests.get",
    "import gridstatus",
]
